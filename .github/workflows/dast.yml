name: DAST - OWASP ZAP Scan

on:
  push:
    branches: [ feature/zap-dast, main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  zap-api-scan:
    name: OWASP ZAP API Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image pour test
        run: docker build -t app-under-test .

    - name: Démarrer l'application FastAPI
        run: |
          docker run -d -p 8000:8000 --name app app-under-test
          # On attend que l'API réponde proprement avec une boucle sécurisée
          for i in {1..15}; do
            if curl -s http://localhost:8000/openapi.json > /dev/null; then
              echo "API is up and running!"
              exit 0
            fi
            echo "Waiting for FastAPI to start..."
            sleep 2
          ]
          echo "API failed to start in time"
          docker logs app
          exit 1
      - name: OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: 'http://172.17.0.1:8000/openapi.json'
          format: openapi
          allow_issue_writing: false
          fail_action: false