name: DAST - OWASP ZAP

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-api-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t app-under-test .

      - name: Start app
        run: |
          docker run -d -p 8000:8000 --name app app-under-test
          curl --retry 15 --retry-delay 2 --retry-connrefused -s http://localhost:8000/openapi.json > /dev/null

      - name: ZAP API scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: 'http://localhost:8000/openapi.json'
          format: openapi
          allow_issue_writing: false
          fail_action: false